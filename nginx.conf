server {
    listen 80;
    server_name decorator.huyiyu.com;

    # certbot 验证域名所有权
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name decorator.huyiyu.com;

    ssl_certificate     /etc/letsencrypt/live/decorator.huyiyu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decorator.huyiyu.com/privkey.pem;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Hugo 静态站点的典型路由回退
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存优化
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }
}
